<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` é o que faz `env(safe-area-inset-bottom)` valer
      alguma coisa: sem ele o browser mantém a viewport dentro da área
      segura, os insets viram 0, e a tab bar fixa embaixo (`App.tsx`) ficaria
      colada na barra de gestos do celular.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Finanças</title>

    <!--
      Plus Jakarta Sans + JetBrains Mono são as duas fontes do design system
      (`packages/ui`). O `apps/web` as serve pelo `next/font`; numa SPA Vite
      o equivalente é este par de links. `display=swap` pra o texto aparecer
      na fonte de sistema enquanto a real baixa, em vez de a tela ficar em
      branco — este app abre num Android, muitas vezes em rede ruim.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
    />
    <!--
      Tema antes do primeiro paint. Arquivo próprio, síncrono (sem defer), porque
      a CSP de public/_headers não aceita script inline.
    -->
    <script src="/tema.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
