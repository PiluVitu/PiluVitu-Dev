<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` é o que faz `env(safe-area-inset-bottom)` valer
      alguma coisa: sem ele o browser mantém a viewport dentro da área
      segura, os insets viram 0, e a tab bar fixa embaixo (`App.tsx`) ficaria
      colada na barra de gestos do celular.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Finanças</title>
    <script>
      // Aplica o tema salvo ANTES do primeiro paint — evita flash de tema
      // errado enquanto o bundle React (deferido, type="module") carrega.
      // Duplica a leitura mínima de `src/lib/theme.ts` (chave de storage +
      // fallback pro SO); manter as duas em sincronia se a chave mudar.
      //
      // M5 (fix final): `localStorage` pode LANÇAR em vez de simplesmente
      // faltar (Safari com storage particionado/privado, política de
      // cookies bloqueando, quota de site desativada) — e este script
      // roda ANTES de `main.tsx`/`createRoot(...).render(...)`. Sem o
      // try/catch, uma exceção aqui é síncrona e interrompe o parse do
      // <head> antes até do <div id="root"> existir: não é só "perde o
      // tema", é a página inteira em branco, sem nenhum React montado.
      ;(function () {
        try {
          var tema = localStorage.getItem('financas-tema')
          var escuro =
            tema === 'escuro' ||
            (tema !== 'claro' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (escuro) document.documentElement.classList.add('dark')
        } catch (e) {
          // localStorage indisponível (storage particionado/privado) —
          // segue sem `.dark`: pior caso é flash de tema claro, não app
          // em branco.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
