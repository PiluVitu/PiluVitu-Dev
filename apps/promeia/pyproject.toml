[project]
name = "promeia"
version = "0.1.0"
description = "Serviço local do MacBook: processamento que exige GPU, modelo local ou arquivo em disco"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.7",
    "httpx>=0.28.1",
    "uvicorn>=0.51.0",
]

[project.scripts]
promeia-insight = "promeia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promeia"]
exclude = ["*_test.py"]

# python_files: o default do pytest é `test_*.py`, que BRIGA com a lei de
# colocation deste projeto (teste no mesmo diretório do fonte, nomeado a
# partir dele — `cpf.go` → `cpf_test.go`). Aqui é `money.py` → `money_test.py`.
[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# insight.py:build_prompt monta o prompt enviado ao modelo como um bloco de
# texto em português corrido — o "PROMPT É CONTRATO" (task 5): o texto tem
# que bater byte a byte com o que o dono já revisou, então as linhas longas
# do parágrafo não podem ser quebradas só para caber em 88 colunas (isso
# inseriria uma quebra de linha real no prompt que o modelo recebe). Único
# arquivo com essa exceção — E501 continua valendo para o resto do projeto.
[tool.ruff.lint.per-file-ignores]
"src/promeia/insight.py" = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
