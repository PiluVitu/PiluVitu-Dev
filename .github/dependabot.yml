version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 20
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'

    # Dias de espera antes de propor uma versão nova (só version updates).
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

    # Aglomera minor e patch em uma única PR por grupo
    groups:
      all-minor-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'

    # Majors ficam isoladas (comportamento padrão fora dos grupos)
    ignore: []

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'

    cooldown:
      default-days: 7

    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
