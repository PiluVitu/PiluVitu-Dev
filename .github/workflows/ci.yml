name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      # Versão lida automaticamente de package.json#packageManager (pnpm@11.x)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @piluvitu/web lint

      - name: Lint (ui package)
        run: pnpm --filter @piluvitu/ui lint

      - name: Typecheck
        run: pnpm --filter @piluvitu/web exec tsc --noEmit

      - name: Test (tools package)
        run: pnpm --filter @piluvitu/tools test

      # Filtro explícito, não `pnpm -r test`: o recursivo PULA EM SILÊNCIO
      # workspace que não declara o script, então um pacote novo sem `test`
      # some do CI sem ninguém notar. Mesma armadilha que já deixou os 14
      # componentes migrados sem lint por um commit inteiro.
      - name: Test (ui package)
        run: pnpm --filter @piluvitu/ui test

      - name: Test (web)
        run: pnpm --filter @piluvitu/web test

      - name: Build (next only — TinaCMS roda na Vercel com secrets reais)
        run: pnpm --filter @piluvitu/web build:ci
        env:
          # Valores dummy: o Keystatic precisa que essas env vars existam
          # durante o build da rota /api/keystatic, mesmo sem OAuth real.
          KEYSTATIC_GITHUB_CLIENT_ID: 'ci-dummy'
          KEYSTATIC_GITHUB_CLIENT_SECRET: 'ci-dummy'
          KEYSTATIC_SECRET: 'ci-dummy-secret-32-chars-padding-x'
          NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: 'ci-dummy'

  # ⚠️ O job `api` (Go: vet + test + build) foi REMOVIDO em 2026-08-14, quando a
  # migração para ramielle/promeia terminou e a Go parou de servir qualquer
  # tráfego. O código de `apps/api` CONTINUA no repositório, de propósito, como
  # referência de paridade — mas não roda mais em CI, não é deployado e não sobe
  # no compose. Ver docs/superpowers/ROADMAP.md § "Substituir a Go por completo".
  #
  # Reativar é reverter este commit: o job estava aqui, com go-version 1.25.

  financas:
    name: Finanças (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (worker)
        run: pnpm --filter @piluvitu/financas run lint

      - name: Typecheck (spa)
        run: pnpm --filter @piluvitu/financas-web run lint

      # O binding ASSETS do Miniflare exige que web/dist exista com um index.html,
      # e web/dist é gerado (está no .gitignore). Por isso o build da SPA vem
      # ANTES dos testes do Worker: em clone limpo, a ordem inversa quebra o job.
      - name: Build (spa)
        run: pnpm --filter @piluvitu/financas-web run build

      # vitest-pool-workers roda em Miniflare local: sem secret, sem wrangler login.
      - name: Test (worker + D1)
        run: pnpm --filter @piluvitu/financas run test

      - name: Test (spa)
        run: pnpm --filter @piluvitu/financas-web run test

  ramielle:
    name: Ramielle (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @piluvitu/ramielle run lint

      # vitest-pool-workers roda em Miniflare local: sem secret, sem wrangler
      # login. Sem SPA pra buildar antes — ramielle não serve assets.
      - name: Test (worker + D1)
        run: pnpm --filter @piluvitu/ramielle run test

  promeia:
    name: Promeia (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/promeia
    steps:
      - uses: actions/checkout@v4

      # v9 (major mais recente publicada nesta sessão — o brief citava v6,
      # desatualizada). `uv sync` baixa o Python de .python-version sozinho,
      # então não há setup-python aqui.
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      # --locked, não --frozen: --frozen instala o lock como está, sem
      # checar se ele ainda bate com pyproject.toml — um pyproject editado
      # sem re-lock passaria batido. --locked ERRA se o lock estiver
      # desatualizado; é o equivalente exato do `pnpm install
      # --frozen-lockfile` que a Vercel usa (nome trocado, mesma semântica).
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
