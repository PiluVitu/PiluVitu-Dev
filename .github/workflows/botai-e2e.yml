name: Botaí E2E

on:
  push:
    branches: [main]
    paths:
      - 'apps/botai/**'
      - 'packages/tools/**'
      - '.github/workflows/botai-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/botai/**'
      - 'packages/tools/**'
      - '.github/workflows/botai-e2e.yml'
  workflow_dispatch:

concurrency:
  group: botai-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Fora do workflow `CI` de propósito: o deploy do finanças espera o `CI` inteiro
# passar, e este E2E (extensão desempacotada no Chromium do Playwright) não pode
# segurar esse deploy.
jobs:
  e2e:
    name: Botaí (Playwright, extensão desempacotada)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sem o headless shell: ele não carrega extensão (o teste usa channel: 'chromium').
      - name: Chromium do Playwright
        run: pnpm --filter @pilutech/botai exec playwright install --with-deps --no-shell chromium

      - name: E2E (build de produção + build e2e + Playwright)
        run: pnpm --filter @pilutech/botai run test:e2e

      - name: Rastros do Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-botai
          path: apps/botai/test-results/
          if-no-files-found: ignore
          retention-days: 7
