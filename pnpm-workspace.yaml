packages:
  - 'apps/web'
  - 'apps/financas'
  - 'apps/financas/web'
  - 'apps/ramielle'
  - 'apps/pilutech-site'
  - 'packages/tools'
  - 'packages/ui'

# Only the packages listed below may run lifecycle scripts during installation.
# All other install scripts are blocked by default (pnpm 11 default).
allowBuilds:
  better-sqlite3: false
  core-js: false
  core-js-pure: true
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
  # workerd (runtime do Miniflare, dep de @cloudflare/vitest-pool-workers) traz
  # um postinstall que só hardlinka o binário nativo por cima do shim JS e
  # valida a versão. Medido: com o script BLOQUEADO, `vitest run` sobe o
  # workerd normalmente — lib/main.js resolve o pacote de plataforma
  # (@cloudflare/workerd-darwin-arm64) em runtime. Fica declarado como `false`
  # porque, sem entrada nenhuma, o pnpm 11 aborta o install com
  # ERR_PNPM_IGNORED_BUILDS (exit 1), o que quebraria o CI.
  workerd: false

# Ignore package versions published less than 24h ago (1440 min).
# Defense against supply-chain attacks where malicious versions are published and quickly pulled.
minimumReleaseAge: 1440
# Falha se um pacote perder a proveniência que tinha (pnpm ≥ 10.21.0).
trustPolicy: no-downgrade
# Versão exata, nunca o nome solto: a próxima versão de cada um volta a ser conferida.
trustPolicyExclude:
  # chokidar 4.0.3 (2024-12-18, via fork-ts-checker-webpack-plugin do @storybook/nextjs) saiu sem a proveniência que a 4.0.0 e a 4.0.1 tinham.
  - 'chokidar@4.0.3'
  # eslint-import-resolver-typescript 3.10.1 (2025-04-21, via eslint-config-next): linha 3.x publicada sem a proveniência que a 4.x já tinha.
  - 'eslint-import-resolver-typescript@3.10.1'
  # semver 6.3.1 (2023-07-10, via @babel/core, eslint-plugin-react e outros): backport do fix de ReDoS sem a proveniência que a 7.5.x já tinha.
  - 'semver@6.3.1'
# Só dependência direta pode vir de git ou de tarball (pnpm ≥ 10.26.0).
blockExoticSubdeps: true
# Sufixo de peer só com nome@versão (pnpm ≥ 10.33.0): com o sufixo aninhado, o ciclo eslint-plugin-import <->
# eslint-import-resolver-typescript mudava de notação conforme a ordem da rede, e o dedupe --check falhava às vezes.
dedupePeers: true
