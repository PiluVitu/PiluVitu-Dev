services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - '8080:8080'
    environment:
      PORT: '8080'
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3333,https://piluvitu.com.br}
      SQLITE_PATH: '/data/votacao.db'
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID não definido — copie apps/api/.env.example}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?GOOGLE_OAUTH_CLIENT_SECRET não definido}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-http://localhost:8080/auth/google/callback}
      WEB_REDIRECT_URL: ${WEB_REDIRECT_URL:-http://localhost:3333/votacao}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/google-sa.json}
      GSHEETS_MOVIES_SPREADSHEET_ID: ${GSHEETS_MOVIES_SPREADSHEET_ID:-}
      GSHEETS_MOVIES_RANGE: ${GSHEETS_MOVIES_RANGE:-A2:F}
    volumes:
      - api-data:/data
      - ./secrets:/secrets:ro
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - '3333:3333'
    environment:
      NEXT_PUBLIC_API_URL: 'http://api:8080'
    depends_on:
      - api
    restart: unless-stopped

  # Cloudflare Tunnel — exposição pública da API sem abrir portas
  # Sobe só com: docker compose --profile tunnel up -d   (ou: make tunnel-up)
  # Token gerado em: dash.cloudflare.com → Zero Trust → Networks → Tunnels
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN não definido — copie infra/.env.example para infra/.env}
    depends_on:
      - api

volumes:
  api-data:
