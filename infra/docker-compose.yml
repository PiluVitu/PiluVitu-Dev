services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - '8080:8080'
    # env_file injeta todas as vars do apps/api/.env (valores de DEV) no container.
    # O bloco environment: abaixo SOBRESCREVE com os valores de PROD — então o
    # `make dev`/air (host, lê o .env direto) continua em dev, e o container
    # (compose-up / tunnel-up) sai em prod. Não precisa togglar o .env.
    env_file:
      - ../apps/api/.env
    environment:
      # Infra do container (paths internos + porta).
      PORT: '8080'
      SQLITE_PATH: '/data/votacao.db'
      GOOGLE_APPLICATION_CREDENTIALS: '/secrets/google-sa.json'
      # Prod (tunnel em https://promeia.piluvitu.com.br, web em piluvitu.com.br).
      # promeia.* e piluvitu.com.br são o MESMO domínio registrável → same-site,
      # então o cookie SameSite=Lax basta (sem precisar de SameSite=None).
      GOOGLE_OAUTH_REDIRECT_URL: 'https://promeia.piluvitu.com.br/auth/google/callback'
      WEB_REDIRECT_URL: 'https://piluvitu.com.br/votacao'
      SESSION_COOKIE_SECURE: 'true'
      CORS_ALLOWED_ORIGINS: 'https://piluvitu.com.br'
    volumes:
      - api-data:/data
      - ./secrets:/secrets:ro
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - '3333:3333'
    environment:
      NEXT_PUBLIC_API_URL: 'http://api:8080'
    depends_on:
      - api
    restart: unless-stopped

  # Cloudflare Tunnel — exposição pública da API sem abrir portas
  # Sobe só com: docker compose --profile tunnel up -d   (ou: make tunnel-up)
  # Token gerado em: dash.cloudflare.com → Zero Trust → Networks → Tunnels
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN não definido — copie infra/.env.example para infra/.env}
    depends_on:
      - api

volumes:
  api-data:
